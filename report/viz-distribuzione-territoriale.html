<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.5 Distribuzione AFAM</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Bootstrap 5.3 -->
    <link href="../src/prototipo/assets/bootstrap-custom.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Swiss Theme -->
    <link rel="stylesheet" href="../src/prototipo/assets/style.css">
    <link rel="stylesheet" href="assets/viz-style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
</head>

<body>

    <!-- Global Header -->
    <div id="global-header"></div>
    <script src="../src/components/header-loader.js"></script>

    <div class="main-container">
        <div class="view-header">
            <div>
                <h1 class="page-title">5. Distribuzione territoriale delle Istituzioni AFAM</h1>
                <p class="page-subtitle">Distribuzione territoriale delle istituzioni partecipanti.</p>
            </div>
            <div class="page-header-actions">
                <div class="total-counter">Istituti <span class="count total-institutions-count">0</span></div>
                <div class="filter-group">
                    <label class="filter-item">
                        <input type="checkbox" class="status-filter" value="Pubblico" checked onchange="applyFilters()">
                        Pubblico
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="status-filter" value="Privato" checked onchange="applyFilters()">
                        Privato
                    </label>
                </div>
                <button class="export-btn" onclick="exportMapToSVG()">Esporta Mappa (SVG)</button>
            </div>
        </div>

        <div id="view-map" class="view-container">
            <div class="controls-group">
                <div class="slider-container">
                    <label for="cluster-radius">Sensibilità Cluster:</label>
                    <input type="range" id="cluster-radius" min="0" max="150" value="20" step="5"
                        oninput="updateClusterRadius(this.value)">
                    <span id="radius-value">20</span>
                </div>
            </div>
            <div id="map-container"></div>
        </div>

        <!-- Navigation Bar -->
        <footer class="viz-nav-footer">
            <a class="btn btn-outline-dark btn-sm rounded-0"  href="infografiche.html">Torna all'indice</a>
            <div class="viz-nav-links">
                <a class="btn btn-outline-dark btn-sm rounded-0"  href="viz-tipologia-afam.html">Precedente: 8.4 Tipologia</a>
                <a class="btn btn-outline-dark btn-sm rounded-0" style="background-color: #000; color: #fff;" disabled>Successivo</a>
            </div>
        </footer>
    </div>


    <div id="tooltip" class="tooltip"></div>

    <script src="assets/viz-config.js"></script>
    <script src="assets/viz-distribuzione-territoriale.js"></script>


    <!-- Global Footer -->
    <div id="global-footer"></div>
    <script src="../src/components/footer-loader.js"></script>
</body>

</html>
