<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.4 Tipologia AFAM</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Bootstrap 5.3 -->
    <link href="../src/prototipo/assets/bootstrap-custom.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Swiss Theme -->
    <link rel="stylesheet" href="../src/prototipo/assets/style.css">
    <link rel="stylesheet" href="assets/viz-style.css">

    <script src="assets/d3.v7.min.js"></script>
</head>

<body>

    <!-- Global Header -->
    <div id="global-header"></div>
    <script src="../src/components/header-loader.js"></script>

    <div class="main-container">
        <div class="view-header pb-1 mb-2 border-0">
            <div>
                <h1 class="page-title">4. Tipologia delle Istituzioni AFAM</h1>
                <p class="page-subtitle">Raggruppamento per tipologia di istituto (Bubble Chart).</p>
            </div>
        </div>

        <!-- Fullscreen Container -->
        <div class="fullscreen-container" style="background-color: #fff;">
            <!-- Standard Control Bar -->
            <div
                class="controls-bar d-flex flex-wrap align-items-center p-3 mb-0 bg-light border-top border-bottom border-dark">
                <!-- Controlli Specifici -->
                <div class="specific-controls d-flex flex-wrap align-items-center gap-3">
                    <div class="d-flex align-items-center rounded bg-dark p-1">
                        <span class="text-uppercase text-white small fw-bold px-2" style="letter-spacing: 0.5px;">Istituti</span>
                        <span class="badge bg-light text-dark total-institutions-count fs-6 ms-1">0</span>
                    </div>
                    <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                        <input class="form-check-input m-0" type="checkbox" role="switch" id="checkPrincipale" onchange="applyFilters()" style="cursor: pointer;">
                        <label class="form-check-label small fw-bold mb-0 pt-1" for="checkPrincipale" style="cursor: pointer;">Solo Sedi Principali</label>
                    </div>
                </div>
            </div>

            <!-- Chart Wrapper -->
            <div id="viz-wrapper"
                style="position: relative; width: 100%; overflow: hidden; border-bottom: 1px solid #000; background-color: #fcfcfc;">
                <!-- Overlay Toolbar -->
                <div class="position-absolute top-0 end-0 m-3 z-3 d-flex flex-column gap-2 shadow-sm rounded p-2"
                    style="background-color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px);">
                    <button class="btn btn-dark btn-sm shadow-sm" onclick="toggleFullscreen()" title="Fullscreen">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>
                    <div class="btn-group-vertical shadow-sm">
                        <button class="btn btn-outline-dark btn-sm" onclick="zoomIn()" title="Zoom In"><i
                                class="bi bi-zoom-in"></i></button>
                        <button class="btn btn-outline-dark btn-sm" onclick="zoomOut()" title="Zoom Out"><i
                                class="bi bi-zoom-out"></i></button>
                        <button class="btn btn-outline-dark btn-sm" onclick="resetZoom()" title="Reset Zoom"><i
                                class="bi bi-arrow-counterclockwise"></i></button>
                        <button class="btn btn-outline-dark btn-sm" onclick="recenter()" title="Centra"><i
                                class="bi bi-bullseye"></i></button>
                    </div>
                    <button class="btn btn-outline-dark btn-sm shadow-sm" onclick="exportVisualization()"
                        title="Esporta Grafico">
                        <i class="bi bi-download"></i>
                    </button>
                </div>
                <div id="view-groups" class="view-container m-0 p-0 border-0"
                    style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;">
                    <div id="bubble-chart" style="width: 100%; height: 100%;"></div>
                </div>
                <div id="tooltip" class="tooltip"></div>
            </div>

        </div> <!-- End Chart Wrapper -->
    </div> <!-- End Fullscreen Container -->

    <!-- Navigation Bar -->
    <footer class="viz-nav-footer">
        <a class="btn btn-outline-dark btn-sm rounded-0" href="infografiche.html">Torna all'indice</a>
        <div class="viz-nav-links">
            <a class="btn btn-outline-dark btn-sm rounded-0" href="viz-scadenze-eventi.html">Precedente: 8.3
                Timeline</a>
            <a class="btn btn-outline-dark btn-sm rounded-0" style="background-color: #000; color: #fff;"
                href="viz-distribuzione-territoriale.html">Successivo: 8.5
                Distribuzione</a>
        </div>
    </footer>
    </div>

    <script src="assets/viz-config.js"></script>
    <script src="assets/viz-tipologia-afam.js"></script>


    <!-- Global Footer -->
    <div id="global-footer"></div>
    <script src="../src/components/footer-loader.js"></script>
</body>

</html>
